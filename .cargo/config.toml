# Cargo configuration for WebRTC Chat Application
#
# This file configures build settings for different targets.

# =============================================================================
# macOS Native Target Configuration
# =============================================================================

# Use rust-lld (LLVM's lld) instead of macOS's default ld64 linker.
#
# macOS ld64 has an internal symbol-name length limit that causes an assertion
# failure when linking cdylib/rlib crates with deeply-nested Rust generics
# (common with Leptos + icondata):
#
#   ld: Assertion failed: (name.size() <= maxLength),
#       function makeSymbolStringInPlace, file SymbolString.cpp, line 74
#
# rust-lld is bundled with every Rust toolchain (under
# $sysroot/lib/rustlib/<target>/bin/rust-lld) and has no such limit.
# This setting only affects native macOS builds (cargo check/test/clippy);
# WASM builds (trunk build / wasm-pack) use the wasm32-unknown-unknown
# target and are unaffected.
[target.aarch64-apple-darwin]
linker = "rust-lld"

[target.x86_64-apple-darwin]
linker = "rust-lld"

# =============================================================================
# WASM Target Configuration
# =============================================================================

# Enable getrandom's wasm_js backend for wasm32-unknown-unknown target
# This is required for UUID generation and other crypto operations in WASM
# See: https://docs.rs/getrandom/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# =============================================================================
# Build Settings
# =============================================================================

[build]
# Use all available CPU cores for compilation
jobs = -1

# =============================================================================
# macOS Deployment Target
# =============================================================================
#
# Without this, C dependencies built via `cc`/build scripts (e.g. aws-lc-sys,
# pulled in transitively via jsonwebtoken -> aws-lc-rs) pick up the *installed*
# macOS SDK version as their minimum OS version, while rustc's own default
# minimum for aarch64-apple-darwin is 11.0. rust-lld checks this and warns:
#
#   warning: linker stderr: rust-lld: ... has version X.Y.Z, which is newer
#   than target minimum of 11.0.0
#
# Setting MACOSX_DEPLOYMENT_TARGET aligns the C build with rustc's minimum,
# eliminating the mismatch. Harmless if the warning appears without this,
# but this keeps build output clean.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[term]
# Enable colorful output
color = "auto"
