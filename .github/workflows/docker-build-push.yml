# ============================================================================
# Docker build & push to Docker Hub
# ============================================================================
# Triggers:
#   - push to `main` branch
#   - push of a `v*` tag (semantic version)
#   - manual dispatch from the Actions tab
#
# Required secrets (configure in repository Settings → Secrets and variables):
#   - DOCKERHUB_USERNAME : Docker Hub username
#   - DOCKERHUB_TOKEN    : Docker Hub access token (not the account password)
# ============================================================================

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      no-cache:
        description: Skip GitHub Actions cache and build from scratch
        type: boolean
        required: false
        default: false

env:
  # Image name is namespaced under the Docker Hub username (lowercased).
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Docker Hub username (lowercase)
        id: hub
        run: |
          USERNAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "username=${USERNAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.username }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ !inputs.no-cache && 'type=gha' || '' }}
          cache-to: ${{ !inputs.no-cache && 'type=gha,mode=max' || '' }}
