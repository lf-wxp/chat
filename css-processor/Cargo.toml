[package]
description = "CSS preprocessor that expands CSS Modules `composes` property using LightningCSS"
edition = "2024"
name = "css-processor"
publish = false
version = "0.1.0"

[[bin]]
name = "css-processor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
lightningcss = "1.0.0-alpha.71"
notify = "8.2"
notify-debouncer-mini = "0.7"
[dev-dependencies]
tempfile = "3.27"
